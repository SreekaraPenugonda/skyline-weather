name: Build Android Weather Widget

on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile/android/**'
      - '.github/workflows/build-android-widget.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Upload widget APK
        uses: actions/upload-artifact@v4
        with:
          name: skyline-weather-widget-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
